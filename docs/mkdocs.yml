site_name: Academia Atlas
site_url: https://brandnova.github.io/academia-atlas/

theme:
  name: material

exclude_docs: |
  content/

nav:
  - Home: index.md
  - Project Plan: project-plan.md
  - Feature List: feature-list.md
  - API Contract: api-contract.md
  - Database Schema: database-schema.md
  - Design Guide: design-guide.md
  - Maps:
      - Backend Map: backend-map.md
      - Web Map: frontend-map.md
      - Mobile Map: mobile-map.md
  - Build Logs:
      - Backend: BUILD_LOG_BACKEND.md
      - Web: BUILD_LOG_FRONTEND.md
      - Mobile: BUILD_LOG_MOBILE.md
  - Mobile mockup: design/Mobile-mockup.html
  - Testing: TESTING.md
  - Deployment Checklist: DEPLOYMENT_CHECKLIST.md
  - Change Log: changelog.md
  - Contributors Quickstart: QUICKSTART.md
  - Maintainer Playbook: MAINTAINER_PLAYBOOK.md

markdown_extensions:
  - pymdownx.snippets