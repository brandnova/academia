{% extends "emails/base_email.html" %}
{% block subject %}Your answer was marked as the best answer{% endblock %}
{% block content %}
<p>Hi {{ recipient_name }},</p>
<p>Good news, your answer was marked as the best one on:</p>
<p class="quote"><strong>{{ question_title }}</strong></p>
<p><a class="button" href="{{ question_url }}">View the question</a></p>
{% endblock %}
